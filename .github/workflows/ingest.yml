# Runs the job import every 3 hours by calling the app's protected endpoint.
# Free on GitHub Actions. Set APP_URL and CRON_SECRET in the repo's Settings → Secrets.
name: Ingest jobs
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 290 "${{ secrets.APP_URL }}/api/cron/ingest")
          cat /tmp/out.json
          test "$code" = "200"
